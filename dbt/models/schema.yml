version: 2
sources:
  - name: raw
    schema: public
    tables:
      - name: payments
      - name: product_events
models:
  - name: stg_payments
    columns:
      - name: payment_id
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: currency
        tests:
          - accepted_values:
              values: ['USD','EUR','GBP']
  - name: fct_payments
    columns:
      - name: amount
        tests: [not_null]
