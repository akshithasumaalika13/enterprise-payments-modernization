groups:
  - name: northstar-platform
    rules:
      - alert: ApiEventIngestionStopped
        expr: rate(northstar_events_total[10m]) == 0
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: "No fintech events ingested for 15 minutes"
      - alert: HighApiErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "API 5xx rate exceeded threshold"
