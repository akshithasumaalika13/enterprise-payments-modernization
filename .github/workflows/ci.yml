name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python tests
        run: python -m pytest -q
      - name: Check Python syntax
        run: python -m compileall -q api streaming data_quality synthetic_data
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.6'
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform -chdir=infra/terraform fmt -check
      - name: Initialize Terraform for validation
        run: terraform -chdir=infra/terraform init -backend=false -input=false
      - name: Validate Terraform configuration
        run: terraform -chdir=infra/terraform validate -no-color
