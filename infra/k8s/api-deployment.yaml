apiVersion: apps/v1
kind: Deployment
metadata: {name: northstar-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: northstar-api}}
  template:
    metadata: {labels: {app: northstar-api}}
    spec:
      containers:
        - name: api
          image: ghcr.io/example/northstar-api:latest
          ports: [{containerPort: 8000}]
          envFrom: [{secretRef: {name: northstar-secrets}}]
---
apiVersion: v1
kind: Service
metadata: {name: northstar-api}
spec:
  selector: {app: northstar-api}
  ports: [{port: 80, targetPort: 8000}]
